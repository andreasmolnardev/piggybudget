name: Publish container image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish linux/amd64 and linux/arm64
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Read image settings
        id: image
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { loadProjectConfig } from './scripts/project-config.js';

          const { config } = await loadProjectConfig();
          console.log(`repository=${config.image.repository}`);
          console.log(`platforms=${config.image.platforms}`);
          console.log(`buildx_version=v${config.tools.dockerBuildx}`);
          NODE

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.repository }}
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-,format=short

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3
        with:
          version: ${{ steps.image.outputs.buildx_version }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ steps.image.outputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
