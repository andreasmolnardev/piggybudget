name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Phase 0 baseline: tool versions pinned to the versions the baseline was
  # measured on. See docs/COMPATIBILITY.md section 1.
  # Baseline: go1.27.1 darwin/arm64, node v22.23.2, pnpm 11.8.0
  check:
    name: build, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - name: Validate project config
        run: pnpm config:check

      - name: Show tool versions
        run: |
          go version
          node --version
          pnpm --version

      - run: pnpm install --frozen-lockfile

      # Web: lint, test, production build. `pnpm build` runs `tsc -b && vite build`,
      # which is where the TypeScript check actually happens.
      - name: Web lint
        run: pnpm lint
      - name: Web test
        run: pnpm test
      - name: Web build (tsc -b && vite build)
        run: pnpm build

      # Server: build and test. `go build ./...` was verified in Phase 0; this job
      # now runs it explicitly rather than relying on `go test` to catch it.
      - name: Server build
        run: go build ./...
      - name: Server vet
        run: go vet ./...
      - name: Server test
        run: go test ./...

      - name: Verify disposable backup and restore
        run: sh scripts/backup-restore-smoke-test.sh

      # Generated artefacts must match what is committed. AGENTS.md forbids
      # hand-editing apps/web/src/api/generated.
      - run: pnpm generate:api
      - run: pnpm generate:client
      - run: git diff --exit-code

  # Guards the migration invariants recorded in docs/baseline.json. A diff here is
  # information, not a hard failure, while the migration is in progress — the point
  # is that every change to the route surface, collection set, or auth flows is a
  # deliberate, reviewed commit rather than an accident.
  baseline-diff:
    name: baseline.json diff (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Compare tracked route/collection surface against docs/baseline.json
        run: |
          node scripts/baseline-check.mjs
        env:
          BASELINE_STRICT: '0'

      - name: Summarise diff
        if: always()
        run: git --no-pager diff --stat

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseline-diff
          path: |
            baseline-report.json
            baseline-report.md

  image-build:
    name: build linux amd64 and arm64 image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Read configured Buildx version
        id: tools
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { loadProjectConfig } from './scripts/project-config.js';
          const { config } = await loadProjectConfig();
          console.log(`version=v${config.tools.dockerBuildx}`);
          NODE
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
        with:
          version: ${{ steps.tools.outputs.version }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=/tmp/piggybudget-image.tar
