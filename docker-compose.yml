services:
  piggybudget:
    build:
      context: .
    ports:
      - "8090:8090"
    environment:
      PIGGYBUDGET_PUBLIC_URL: http://localhost:8090
      PIGGYBUDGET_STORAGE_PATH: /app/pb_data
      PIGGYBUDGET_BACKUP_ENABLED: "true"
      PIGGYBUDGET_BACKUP_CRON: "0 3 * * *"
      PIGGYBUDGET_BACKUP_MAX_KEEP: "14"
      PIGGYBUDGET_BACKUP_S3_ENABLED: "${PIGGYBUDGET_BACKUP_S3_ENABLED:-${SLOPSTACK_BACKUP_S3_ENABLED:-false}}"
      PIGGYBUDGET_BACKUP_S3_BUCKET: "${PIGGYBUDGET_BACKUP_S3_BUCKET:-${SLOPSTACK_BACKUP_S3_BUCKET:-}}"
      PIGGYBUDGET_BACKUP_S3_REGION: "${PIGGYBUDGET_BACKUP_S3_REGION:-${SLOPSTACK_BACKUP_S3_REGION:-}}"
      PIGGYBUDGET_BACKUP_S3_ENDPOINT: "${PIGGYBUDGET_BACKUP_S3_ENDPOINT:-${SLOPSTACK_BACKUP_S3_ENDPOINT:-}}"
      PIGGYBUDGET_BACKUP_S3_ACCESS_KEY: "${PIGGYBUDGET_BACKUP_S3_ACCESS_KEY:-${SLOPSTACK_BACKUP_S3_ACCESS_KEY:-}}"
      PIGGYBUDGET_BACKUP_S3_SECRET: "${PIGGYBUDGET_BACKUP_S3_SECRET:-${SLOPSTACK_BACKUP_S3_SECRET:-}}"
      PIGGYBUDGET_BACKUP_S3_FORCE_PATH_STYLE: "${PIGGYBUDGET_BACKUP_S3_FORCE_PATH_STYLE:-${SLOPSTACK_BACKUP_S3_FORCE_PATH_STYLE:-false}}"
    volumes:
      - slopstack-data:/app/pb_data

volumes:
  slopstack-data:
